name: Three-engine integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout NEXUS
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install locked release dependencies
        run: npm ci --ignore-scripts

      - name: Verify exact engine versions
        run: npm ls @wess2001/component-vault@0.6.0 @wess2001/velocity@0.3.1 @wess2001/specter@0.1.1

      - name: Run NEXUS integration smoke
        run: npm run test:integration
