name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: find bin src test -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Unit tests
        run: npm test

      - name: Validate JSON artifacts
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/nexus-report.schema.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('nexus.config.example.json','utf8'))"

      - name: CLI smoke
        run: |
          node bin/nexus.js version
          node bin/nexus.js doctor --json > doctor.json
          node -e "const r=require('./doctor.json'); if(!Array.isArray(r.engines)||r.engines.length!==3) process.exit(1)"

      - name: Package consumer smoke
        if: matrix.node == 20
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          package_path="$PWD/$(find artifacts -name '*.tgz' -maxdepth 1 -print -quit)"
          temp_dir=$(mktemp -d)
          cd "$temp_dir"
          npm init -y >/dev/null
          npm install --ignore-scripts "$package_path"
          test "$(./node_modules/.bin/nexus version)" = "0.1.0-dev.1"
          ./node_modules/.bin/nexus doctor --json > doctor.json
          node -e "const r=require('./doctor.json'); if(r.engines.length!==3) process.exit(1)"
