name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check
        run: find bin src test scripts -name '*.js' -o -name '*.mjs' | xargs -n1 node --check

      - name: Unit tests
        run: npm test

      - name: Validate JSON artifacts
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/nexus-report.schema.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('nexus.config.example.json','utf8'))"

      - name: CLI and engine smoke
        run: |
          test "$(node bin/nexus.js version)" = "0.1.0"
          node bin/nexus.js doctor --json > doctor.json
          node -e "const r=require('./doctor.json'); if(r.engines.length!==3 || r.engines.some(e=>!e.available)) process.exit(1)"

      - name: Three-engine smoke
        run: npm run test:integration

      - name: Package consumer smoke
        if: matrix.node == 20
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          package_path="$PWD/$(find artifacts -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$package_path"

          temp_dir=$(mktemp -d)
          cd "$temp_dir"
          npm init -y >/dev/null
          npm install --ignore-scripts "$package_path"

          test "$(./node_modules/.bin/nexus version)" = "0.1.0"
          ./node_modules/.bin/nexus doctor --json > doctor.json
          node -e "const r=require('./doctor.json'); if(r.engines.length!==3 || r.engines.some(e=>!e.available)) process.exit(1)"

          cat > nexus.config.json <<'JSON'
          {
            "engines": {
              "quality": true,
              "performance": true,
              "security": true
            },
            "gate": {
              "failOn": "high",
              "requireEngines": true,
              "minScores": {
                "performance": 80,
                "security": 80
              }
            },
            "security": {
              "offline": true,
              "build": false,
              "dependencies": false,
              "runtime": false
            }
          }
          JSON

          ./node_modules/.bin/nexus check "$GITHUB_WORKSPACE/test/fixtures/healthy-project" --config nexus.config.json --json > report.json
          node -e "const r=require('./report.json'); if(r.status!=='completed'||!r.gate.passed||r.engines.length!==3) process.exit(1)"
